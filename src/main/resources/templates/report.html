<!DOCTYPE html><html lang="de" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Netz melden')}"></head><body>
<header th:replace="~{fragments :: header}"></header><main class="narrow"><p class="eyebrow">NEUER FUND</p><h1>Geisternetz melden</h1><p>Erfasse den Standort und die geschätzte Fläche des Netzes.</p>
<form class="card" th:action="@{/nets/new}" th:object="${reportForm}" method="post">
<div class="error" role="alert" th:if="${#fields.hasAnyErrors()}"><p>Bitte überprüfe deine Angaben:</p><ul><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div>
<label for="latitude">Breitengrad *</label><input id="latitude" type="number" step="0.000001" min="-90" max="90" required th:field="*{latitude}" placeholder="z. B. 54.180000">
<label for="longitude">Längengrad *</label><input id="longitude" type="number" step="0.000001" min="-180" max="180" required th:field="*{longitude}" placeholder="z. B. 12.080000">
<label for="sizeSquareMeters">Geschätzte Fläche in m² *</label><input id="sizeSquareMeters" type="number" min="0.01" max="9999999999.99" step="0.01" required th:field="*{sizeSquareMeters}">
<fieldset><legend>Kontaktangaben (freiwillig)</legend><p class="hint">Für eine anonyme Meldung beide Felder leer lassen. Andernfalls bitte Name und Telefonnummer angeben.</p>
<label for="name">Name</label><input id="name" maxlength="100" th:field="*{name}" autocomplete="name"><label for="phone">Telefonnummer</label><input id="phone" type="tel" maxlength="40" th:field="*{phone}" autocomplete="tel"></fieldset>
<div class="form-actions"><button type="submit">Netz melden</button><a th:href="@{/}">Abbrechen</a></div>
</form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
